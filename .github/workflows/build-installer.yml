name: Build Windows Desktop Installer (Always Free)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or Tag in gal-anonym to build'
        required: true
        default: 'main'
      create_release:
        description: 'Publish as official GitHub Release in galanonim-release'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build-installer:
    name: Build Installer on Free GitHub Windows Runner
    runs-on: windows-latest
    steps:
      - name: 1. Pobranie kodu aplikacji (zeslownikiem/gal-anonym)
        uses: actions/checkout@v4
        with:
          repository: zeslownikiem/gal-anonym
          token: ${{ secrets.GAL_ANONYM_READ_TOKEN }}
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: 2. Konfiguracja srodowiska .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: 3. Publikacja aplikacji WinForms (Self-Contained .NET 10)
        run: dotnet publish GalAnonim/GalAnonim.csproj -c Release -f net10.0-windows -r win-x64 --self-contained true -p:PublishSingleFile=false

      - name: 4. Weryfikacja bazy slow i zasobow
        shell: powershell
        run: |
          $resourcesDirs = @(\x22GalAnonim\Resources\x22, \x22GalAnonim\bin\Release\net10.0-windows\win-x64\publish\Resources\x22)
          foreach ($dir in $resourcesDirs) {
            if (Test-Path $dir) {
              $files = Get-ChildItem -Path $dir -Filter \x22galanonim.db*\x22
              foreach ($f in $files) {
                if ($f.Extension -eq \x22.stamp\x22) { continue }
                $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
                if ($bytes.Length -ge 2 -and $bytes[0] -eq 0x1F -and $bytes[1] -eq 0x8B) {
                  Write-Error \x22Plik $($f.FullName) jest nieszyfrowanym archiwum GZip (magia 1F 8B)!\x22
                  exit 1
                }
                if ($bytes.Length -ge 16 -and [System.Text.Encoding]::ASCII.GetString($bytes[0..15]).StartsWith(\x22SQLite format 3\x22)) {
                  Write-Error \x22Plik $($f.FullName) jest nieszyfrowana baza SQLite!\x22
                  exit 1
                }
                Write-Host \x22Zasob $($f.Name) zweryfikowany: brak czystego tekstu.\x22
              }
            }
          }

      - name: 5. Przygotowanie Inno Setup
        shell: powershell
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc -or -not (Test-Path $iscc)) {
            $candidates = @(
              \x22$([System.Environment]::GetFolderPath('ProgramFilesX86'))\Inno Setup 6\iscc.exe\x22,
              \x22$([System.Environment]::GetFolderPath('ProgramFiles'))\Inno Setup 6\iscc.exe\x22,
              \x22$env:LOCALAPPDATA\Programs\Inno Setup 6\iscc.exe\x22,
              \x22C:\ProgramData\chocolatey\bin\iscc.exe\x22
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) { $iscc = $c; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
            if (-not $iscc) {
              $iscc = \x22$([System.Environment]::GetFolderPath('ProgramFilesX86'))\Inno Setup 6\iscc.exe\x22
            }
          }
          Write-Host \x22Inno Setup zlokalizowany: $iscc\x22
          Add-Content -Path $env:GITHUB_ENV -Value \x22ISCC_PATH=$iscc\x22

      - name: 6. Wyciagniecie wersji aplikacji
        id: extract_version
        shell: powershell
        run: |
          [xml]$csproj = Get-Content \x22GalAnonim/GalAnonim.csproj\x22
          $version = ($csproj.Project.PropertyGroup.Version | Out-String).Trim()
          if (-not $version) { $version = \x221.0.0\x22 }
          Write-Host \x22Wersja aplikacji: $version\x22
          Add-Content -Path $env:GITHUB_ENV -Value \x22APP_VERSION=$version\x22

      - name: 7. Pobranie WebView2 Bootstrapper
        shell: powershell
        run: |
          Invoke-WebRequest -Uri \x22https://go.microsoft.com/fwlink/p/?LinkId=2124703\x22 -OutFile \x22Deployment/MicrosoftEdgeWebview2Setup.exe\x22 -UseBasicParsing

      - name: 8. Pobranie Morfeusz 2 (morfeusz2.dll + SGJP)
        shell: powershell
        run: |
          & \x22Deployment/Get-Morfeusz.ps1\x22 -TargetDir \x22Deployment\x22
          $publishDir = \x22GalAnonim\bin\Release\net10.0-windows\win-x64\publish\x22
          if (Test-Path $publishDir) {
            Copy-Item -Path \x22Deployment\morfeusz2.dll\x22 -Destination (Join-Path $publishDir \x22morfeusz2.dll\x22) -Force
            Write-Host \x22morfeusz2.dll skopiowany do: $publishDir\x22
          }

      - name: 9. Kompilacja instalatora przez Inno Setup
        shell: powershell
        run: |
          Write-Host \x22Kompilowanie instalatora Inno Setup v$env:APP_VERSION...\x22
          & \x22$env:ISCC_PATH\x22 \x22/dMyAppVersion=$env:APP_VERSION\x22 \x22Deployment/InnoSetup.iss\x22
          Get-ChildItem -Path \x22Deployment/Output\x22 -Filter \x22*.exe\x22 | Format-Table Name, Length

      - name: 10. Upload instalatora jako artefakt CI/CD
        uses: actions/upload-artifact@v4
        with:
          name: GalAnonim-Setup-v${{ env.APP_VERSION }}-x64
          path: Deployment/Output/*.exe
          retention-days: 7

      - name: 11. Publikacja w GitHub Releases (opcjonalnie)
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: GalAnonim v${{ env.APP_VERSION }}
          files: Deployment/Output/*.exe
          generate_release_notes: true