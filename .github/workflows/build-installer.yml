name: CI/CD Pipeline & Windows Installer (Always Free)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or Tag in gal-anonym to build'
        required: true
        default: 'main'
      create_release:
        description: 'Publish as official GitHub Release in galanonim-release'
        type: boolean
        default: false
  repository_dispatch:
    types: [trigger-installer-build]

permissions:
  contents: write
  actions: write

jobs:
  test-windows:
    name: Test on Windows (Unit Tests & Engine)
    runs-on: windows-latest
    steps:
      - name: 1. Pobranie kodu aplikacji (zeslownikiem/gal-anonym)
        uses: actions/checkout@v4
        with:
          repository: zeslownikiem/gal-anonym
          token: ${{ secrets.GAL_ANONYM_READ_TOKEN }}
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}

      - name: 2. Konfiguracja srodowiska .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: 3. Sprawdzenie czystosci kodu (Linter)
        run: dotnet format GalAnonim/GalAnonim.csproj --verify-no-changes

      - name: 4. Budowanie w konfiguracji Debug
        run: dotnet build GalAnonim/GalAnonim.csproj -c Debug

      - name: 5. Pobranie biblioteki Morfeusz 2
        shell: powershell
        run: |
          $tempDir = Join-Path $env:RUNNER_TEMP "morfeusz"
          if (-not (Test-Path $tempDir)) { New-Item -ItemType Directory -Path $tempDir -Force | Out-Null }
          $zipPath = Join-Path $tempDir "morfeusz2.zip"
          $meta = Invoke-RestMethod -Uri "https://pypi.org/pypi/morfeusz2/1.99.15/json"
          $wheelUrl = ($meta.urls | Where-Object { $_.filename -like "*win_amd64*" } | Select-Object -First 1).url
          Write-Host "Pobieranie Morfeusz 2 z: $wheelUrl"
          Invoke-WebRequest -Uri $wheelUrl -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath $tempDir -Force
          $dll = Join-Path $tempDir "morfeusz2.dll"
          if (-not (Test-Path $dll)) {
            Write-Error "morfeusz2.dll nie znaleziony w rozpakowanym pakiecie."
            exit 1
          }
          Write-Host "Morfeusz 2 DLL gotowy: $dll"
          Add-Content -Path $env:GITHUB_ENV -Value "GALANONIM_MORFEUSZ=$dll"

      - name: 6. Uruchomienie testow jednostkowych (dotnet test)
        env:
          REQUIRE_MORFEUSZ: '1'
        run: dotnet test GalAnonim.Tests/GalAnonim.Tests.csproj -c Release

      - name: 7. Testy Frontendu JavaScript (node:test)
        run: node --test GalAnonim.Tests/Frontend/hosted-batch.test.cjs

  smoke-test-windows:
    name: UI Smoke Test (WebView2)
    needs: [test-windows]
    runs-on: windows-latest
    steps:
      - name: 1. Pobranie kodu aplikacji (zeslownikiem/gal-anonym)
        uses: actions/checkout@v4
        with:
          repository: zeslownikiem/gal-anonym
          token: ${{ secrets.GAL_ANONYM_READ_TOKEN }}
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}

      - name: 2. Konfiguracja srodowiska .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: 3. Budowanie aplikacji WinForms (Release)
        run: dotnet build GalAnonim/GalAnonim.csproj -c Release

      - name: 4. Pobranie biblioteki Morfeusz 2 dla smoke testu
        shell: powershell
        run: |
          & "Deployment/Get-Morfeusz.ps1" -TargetDir "GalAnonim/bin/Release/net10.0-windows"

      - name: 5. Uruchomienie smoke testu (renderowanie UI + zrzut ekranu)
        shell: powershell
        env:
          GALANONIM_SMOKE_SCREENSHOT: ${{ github.workspace }}\smoke-screenshot.png
        run: |
          $exe = Join-Path $pwd "GalAnonim\bin\Release\net10.0-windows\GalAnonim.exe"
          Write-Host "Uruchamianie smoke testu: $exe"
          $proc = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru -RedirectStandardOutput "smoke-stdout.log" -RedirectStandardError "smoke-stderr.log"
          $exitCode = $proc.ExitCode
          Write-Host "Exit code: $exitCode"
          if (Test-Path "smoke-stdout.log") { Write-Host "--- stdout ---"; Get-Content "smoke-stdout.log" }
          if (Test-Path "smoke-stderr.log") { Write-Host "--- stderr ---"; Get-Content "smoke-stderr.log" }

          if ($exitCode -ne 0) {
            Write-Error "Smoke test zakonczony niepowodzeniem (exit code $exitCode)."
            exit $exitCode
          }
          if (-not (Test-Path $env:GALANONIM_SMOKE_SCREENSHOT)) {
            Write-Error "Zrzut ekranu nie zostal zapisany mimo exit code 0."
            exit 1
          }
          Write-Host "Smoke test OK - zrzut ekranu: $env:GALANONIM_SMOKE_SCREENSHOT"

      - name: 6. Kopiowanie logu Serilog do diagnostyki
        if: always()
        shell: powershell
        run: |
          $logDir = Join-Path $env:LOCALAPPDATA "GalAnonim\logs"
          if (Test-Path $logDir) {
            Copy-Item (Join-Path $logDir "*.txt") -Destination . -ErrorAction SilentlyContinue
          }

      - name: 7. Upload zrzutu ekranu i logow jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galanonim-smoke-diagnostics
          path: |
            smoke-screenshot.png
            smoke-stdout.log
            smoke-stderr.log
            *.txt
          retention-days: 7
          if-no-files-found: ignore

  build-installer:
    name: Build & Publish Installer on Free GitHub Windows Runner
    needs: [test-windows, smoke-test-windows]
    runs-on: windows-latest
    steps:
      - name: 1. Pobranie kodu aplikacji (zeslownikiem/gal-anonym)
        uses: actions/checkout@v4
        with:
          repository: zeslownikiem/gal-anonym
          token: ${{ secrets.GAL_ANONYM_READ_TOKEN }}
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}

      - name: 2. Konfiguracja srodowiska .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: 3. Publikacja aplikacji WinForms (Self-Contained .NET 10)
        run: dotnet publish GalAnonim/GalAnonim.csproj -c Release -f net10.0-windows -r win-x64 --self-contained true -p:PublishSingleFile=false

      - name: 4. Weryfikacja bazy slow i zasobow (AES-256-GCM)
        shell: powershell
        run: |
          $resourcesDirs = @("GalAnonim\Resources", "GalAnonim\bin\Release\net10.0-windows\win-x64\publish\Resources")
          foreach ($dir in $resourcesDirs) {
            if (Test-Path $dir) {
              $files = Get-ChildItem -Path $dir -Filter "galanonim.db*"
              foreach ($f in $files) {
                if ($f.Extension -eq ".stamp") { continue }
                $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
                if ($bytes.Length -ge 2 -and $bytes[0] -eq 0x1F -and $bytes[1] -eq 0x8B) {
                  Write-Error "Plik $($f.FullName) jest nieszyfrowanym archiwum GZip (magia 1F 8B)!"
                  exit 1
                }
                if ($bytes.Length -ge 16 -and [System.Text.Encoding]::ASCII.GetString($bytes[0..15]).StartsWith("SQLite format 3")) {
                  Write-Error "Plik $($f.FullName) jest nieszyfrowana baza SQLite!"
                  exit 1
                }
                Write-Host "Zasob $($f.Name) zweryfikowany: brak czystego tekstu."
              }
            }
          }

      - name: 5. Przygotowanie Inno Setup
        shell: powershell
        run: |
          $cmd = Get-Command iscc -ErrorAction SilentlyContinue
          $iscc = ""
          if ($cmd) { $iscc = $cmd.Source }
          if (-not $iscc -or -not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source } else { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          }
          Write-Host "Inno Setup zlokalizowany: $iscc"
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC_PATH=$iscc"

      - name: 6. Wyciagniecie wersji aplikacji
        id: extract_version
        shell: powershell
        run: |
          [xml]$csproj = Get-Content "GalAnonim/GalAnonim.csproj"
          $version = ($csproj.Project.PropertyGroup.Version | Out-String).Trim()
          if (-not $version) { $version = "1.0.0" }
          Write-Host "Wersja aplikacji: $version"
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version"

      - name: 7. Pobranie WebView2 Bootstrapper
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "Deployment/MicrosoftEdgeWebview2Setup.exe" -UseBasicParsing

      - name: 8. Pobranie Morfeusz 2 (morfeusz2.dll + SGJP)
        shell: powershell
        run: |
          & "Deployment/Get-Morfeusz.ps1" -TargetDir "Deployment"
          $publishDir = "GalAnonim\bin\Release\net10.0-windows\win-x64\publish"
          if (Test-Path $publishDir) {
            Copy-Item -Path "Deployment\morfeusz2.dll" -Destination (Join-Path $publishDir "morfeusz2.dll") -Force
            Write-Host "morfeusz2.dll skopiowany do: $publishDir"
          }

      - name: 9. Kompilacja instalatora przez Inno Setup
        shell: powershell
        run: |
          Write-Host "Kompilowanie instalatora Inno Setup v$env:APP_VERSION..."
          & "$env:ISCC_PATH" "/dMyAppVersion=$env:APP_VERSION" "Deployment/InnoSetup.iss"
          Get-ChildItem -Path "Deployment/Output" -Filter "*.exe" | Format-Table Name, Length

      - name: 10. Upload instalatora jako artefakt CI/CD
        uses: actions/upload-artifact@v4
        with:
          name: GalAnonim-Setup-v${{ env.APP_VERSION }}-x64
          path: Deployment/Output/*.exe
          retention-days: 7

      - name: 11. Publikacja w GitHub Releases (opcjonalnie)
        if: ${{ github.event.inputs.create_release == 'true' || github.event.client_payload.create_release == 'true' || (github.event_name == 'repository_dispatch' && github.event.client_payload.create_release != 'false') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.client_payload.tag || format('v{0}', env.APP_VERSION) }}
          name: GalAnonim ${{ github.event.client_payload.tag || format('v{0}', env.APP_VERSION) }}
          files: Deployment/Output/*.exe
          generate_release_notes: true
